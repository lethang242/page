<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByTony Logo</title>
    <!-- Nhúng Font Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* Khung chứa toàn bộ Logo */
        .logo-wrapper {
            display: inline-flex;
            align-items: flex-end; /* Căn lề dưới cho ByT và onyx */
            font-size: 130px;
            font-weight: 900;
            color: #000000;
            line-height: 1; /* Loại bỏ khoảng trống dòng */
            letter-spacing: -2px; /* Dấu gạch nối gần nhau hơn cho ByTony */
        }

        /* Phần chữ "ByT" */
        .prefix {
            display: inline-block;
        }

        /* Khung riêng cho chữ "ony" và phần chữ phía trên */
        .ony-container {
            display: inline-flex;
            flex-direction: column;
            position: relative;
        }

        /* Chữ "ony" lớn chính */
        .ony-main-text {
            display: inline-block;
        }

        /* Dải chữ nhỏ phía trên: Tự động căn lề trên "ony" */
        .sub-text-layer {
            display: flex;
            justify-content: space-between; /* Giản cách đều giữa các chữ */
            font-size: 14px; /* Kích thước chữ nhỏ phù hợp */
            font-weight: 500; /* Độ đậm vừa phải */
            color: #000000;
            letter-spacing: 0; /* Giữ giản cách chữ mặc định */
            width: 100%; /* Chiều rộng bằng chiều rộng "ony" */
            position: absolute;
            top: -20px; /* Di chuyển dải chữ nhỏ lên phía trên "ony" */
            left: 0;
            line-height: normal; /* Đảm bảo chiều cao dòng tiêu chuẩn cho dải chữ nhỏ */
        }
    </style>
</head>
<body>

    <div class="logo-wrapper">
        <span class="prefix">ByT</span>
        <div class="ony-container">
            <div class="sub-text-layer">
                <span>Experience</span>
                <span>From</span>
                <span>Tony</span>
            </div>
            <span class="ony-main-text">ony</span>
        </div>
    </div>

</body>
</html>
