<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ByTony Logo</title>
  <!-- Nhúng Font Montserrat -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* Các chữ nhỏ phía trên */
    .sub-text {
      display: flex;
      gap: 40px;
      font-size: 16px;
      font-weight: 400;
      color: #333333;
      letter-spacing: 1px;
    }

    /* Chữ ByTony lớn chính */
    .main-logo {
      font-size: 120px;
      font-weight: 900;
      color: #000000;
      line-height: 1;
      letter-spacing: -2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="sub-text">
      <span>Experience</span>
      <span>From</span>
      <span>Tony</span>
    </div>
    <div class="main-logo">ByTony</div>
  </div>

</body>
</html>
