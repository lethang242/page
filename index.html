<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ByTony Logo</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.logo{
    display:flex;
    align-items:flex-end;
    font-family:'Montserrat',sans-serif;
    font-weight:900;
    font-size:130px;
    line-height:.9;
    color:#000;
    letter-spacing:-4px;
}

/* ByT */
.prefix{
    line-height:.9;
}

/* ony */
.ony{
    position:relative;
    display:inline-block;

    /* sát chữ T */
    margin-left:-12px;
}

/* Experience From Tony */
.tagline{
    position:absolute;

    /* đúng chiều rộng của ony */
    width:100%;
    left:0;

    /* nằm trong gạch ngang chữ T */
    top:-10px;

    text-align:center;

    font-family:"Times New Roman",serif;
    font-size:17px;
    font-weight:400;

    line-height:1;
    white-space:nowrap;

    letter-spacing:0;
}

.main{
    line-height:.9;
}

</style>

</head>

<body>

<div class="logo">

    <div class="prefix">
        ByT
    </div>

    <div class="ony">

        <div class="tagline">
            Experience From Tony
        </div>

        <div class="main">
            ony
        </div>

    </div>

</div>

</body>
</html>
