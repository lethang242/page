<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.logo{
    display:flex;
    align-items:flex-end;
    font-family:'Montserrat',sans-serif;
    font-weight:900;
    font-size:130px;
    line-height:1;
    color:#000;
    letter-spacing:-3px;
}

.prefix{
    line-height:1;
}

.ony{
    position:relative;
    line-height:1;
}

.tagline{
    position:absolute;

    /* nằm trên chữ ony */
    left:50%;
    transform:translateX(-50%);

    /* chỉnh lên xuống ở đây */
    top:-26px;

    width:max-content;

    font-family:"Times New Roman",serif;
    font-size:18px;
    font-weight:400;
    letter-spacing:0;

    white-space:nowrap;
    line-height:1;
}

</style>

</head>

<body>

<div class="logo">

    <div class="prefix">ByT</div>

    <div class="ony">

        <div class="tagline">
            Experience From Tony
        </div>

        ony

    </div>

</div>

</body>
</html>
