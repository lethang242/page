<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ByTony Logo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.logo{
    position:relative;
    display:inline-block;
}

/* Logo chính */
.logo-text{
    font-family:'Archivo Black', sans-serif;
    font-weight:400;

    font-size:148px;

    color:#000;

    line-height:.82;

    letter-spacing:-7px;      /* tăng khoảng cách nhẹ để chữ đỡ dính */

    transform:scaleX(.97);    /* từ .93 lên .97 => chữ dày hơn */
    transform-origin:left center;

    -webkit-text-stroke:.4px #000;   /* tăng độ đậm */
}

/* Experience From Tony */
.tagline{
    position:absolute;

    left:230px;
    top:3px;

    width:255px;

    text-align:center;

    font-family:"Times New Roman", serif;
    font-size:22px;
    font-weight:400;

    line-height:1;
    white-space:nowrap;

    color:#000;

    letter-spacing:-0.2px;
}
</style>
</head>

<body>

<div class="logo">

    <div class="logo-text">ByTony</div>

    <div class="tagline">Experience From Tony</div>

</div>

</body>
</html>
