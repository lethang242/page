<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ByTony Logo</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.logo{
    display:flex;
    align-items:flex-end;
    transform:translateY(-80px);
}

/* By */
.by{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:190px;
    line-height:.82;
    letter-spacing:-7px;
    color:#000;
    transform:scaleX(.97);
    -webkit-text-stroke:.4px #000;
}

/* Tony */
.tony{
    position:relative;
    display:inline-block;

    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:190px;
    line-height:.82;
    letter-spacing:-7px;
    color:#000;
    transform:scaleX(.97);
    -webkit-text-stroke:.4px #000;

    margin-left:-8px;
}

/* Experience From Tony */
.tagline{
    position:absolute;

    left:0;
    right:0;

    top:8px;

    text-align:center;

    font-family:"Times New Roman",serif;
    font-size:30px;
    font-weight:400;

    color:#666666;

    white-space:nowrap;
    line-height:1;
    letter-spacing:-0.2px;
}

</style>
</head>

<body>

<div class="logo">

    <span class="by">By</span>

    <span class="tony">

        <span class="tagline">
            Experience From Tony
        </span>

        Tony

    </span>

</div>

</body>
</html>
