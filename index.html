<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ByTony Logo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.logo{
    position:relative;
    display:inline-block;
}

/* Logo chính */
.logo-text{
    font-family:Arial, Helvetica, sans-serif;
    font-weight:900;
    font-size:145px;
    color:#000;
    line-height:.85;
    letter-spacing:-9px;
}

/* Experience From Tony */
.tagline{
    position:absolute;

    /* Vị trí */
    left:238px;
    top:10px;

    /* Độ rộng đúng phần Tony */
    width:250px;

    text-align:center;

    font-family:"Times New Roman", serif;
    font-size:19px;
    font-weight:400;
    line-height:1;
    white-space:nowrap;
    color:#000;
}
</style>
</head>

<body>

<div class="logo">

    <div class="logo-text">ByTony</div>

    <div class="tagline">Experience From Tony</div>

</div>

</body>
</html>
